name: Build and Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      rollback_app_image:
        description: Previously deployed app image digest
        type: string
      rollback_gdrive_image:
        description: Previously deployed Drive sidecar image digest
        type: string
      rollback_source_sha:
        description: Full source SHA of the rollback app image
        type: string

permissions:
  contents: read

concurrency:
  group: teslacam-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  APP_IMAGE_NAME: ben-z/teslacam-replay
  GDRIVE_IMAGE_NAME: ben-z/teslacam-replay-gdrive-serve-lite
  GDRIVE_SOURCE_SHA: 3143d06af5d5d324e5a5b3403f15912c93a6c553

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      rollback: ${{ steps.source.outputs.rollback }}
      app_image: ${{ steps.source.outputs.app_image }}
      gdrive_image: ${{ steps.source.outputs.gdrive_image }}
    steps:
      - id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          ROLLBACK_APP_IMAGE: ${{ inputs.rollback_app_image }}
          ROLLBACK_GDRIVE_IMAGE: ${{ inputs.rollback_gdrive_image }}
          ROLLBACK_SOURCE_SHA: ${{ inputs.rollback_source_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Deployments and image rollbacks must use the main workflow." >&2
              exit 1
            fi
            source_sha="$DISPATCH_SHA"
          else
            source_sha="$AUTOMATIC_SHA"
          fi
          rollback=false
          if [[ -n "$ROLLBACK_APP_IMAGE$ROLLBACK_GDRIVE_IMAGE$ROLLBACK_SOURCE_SHA" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ||
                  ! "$ROLLBACK_APP_IMAGE" =~ ^ghcr\.io/ben-z/teslacam-replay@sha256:[0-9a-f]{64}$ ||
                  ! "$ROLLBACK_GDRIVE_IMAGE" =~ ^ghcr\.io/ben-z/teslacam-replay-gdrive-serve-lite@sha256:[0-9a-f]{64}$ ||
                  ! "$ROLLBACK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Rollback requires both immutable image digests and their full source SHA." >&2
              exit 1
            fi
            source_sha="$ROLLBACK_SOURCE_SHA"
            rollback=true
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          echo "app_image=$ROLLBACK_APP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "gdrive_image=$ROLLBACK_GDRIVE_IMAGE" >> "$GITHUB_OUTPUT"

  build-app:
    needs: prepare
    if: needs.prepare.outputs.rollback == 'false'
    strategy:
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - uses: docker/build-push-action@91df6b874e498451163feb47610c87c4a218c1ee # v6.18.0
        id: build
        with:
          build-args: SOURCE_SHA=${{ needs.prepare.outputs.sha }}
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.APP_IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}-${{ matrix.architecture }}

  build-gdrive:
    needs: prepare
    if: needs.prepare.outputs.rollback == 'false'
    strategy:
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ben-z/gdrive-serve-lite
          ref: ${{ env.GDRIVE_SOURCE_SHA }}
          path: gdrive-source
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - run: cp deploy/gdrive-serve-lite.Dockerfile gdrive-source/Dockerfile
      - uses: docker/build-push-action@91df6b874e498451163feb47610c87c4a218c1ee # v6.18.0
        id: build
        with:
          build-args: SOURCE_SHA=${{ env.GDRIVE_SOURCE_SHA }}
          context: ./gdrive-source
          file: ./gdrive-source/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.GDRIVE_IMAGE_NAME }}:sha-${{ env.GDRIVE_SOURCE_SHA }}-${{ matrix.architecture }}

  publish-app:
    needs: [prepare, build-app]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.rollback == 'true' || needs.build-app.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - id: publish
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          ROLLBACK_IMAGE: ${{ needs.prepare.outputs.app_image }}
        run: |
          if [[ -n "$ROLLBACK_IMAGE" ]]; then
            tag="$ROLLBACK_IMAGE"
          else
            tag="$IMAGE_REGISTRY/$APP_IMAGE_NAME:sha-$SOURCE_SHA"
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          fi
          manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<< "$manifest")"
          platforms="$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.os)/\(.platform.architecture)"] | unique | sort | join(",")' <<< "$manifest")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid app manifest digest: $digest" >&2
            exit 1
          fi
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "App manifest has unexpected platforms: $platforms" >&2
            exit 1
          fi
          for image_digest in $(jq -r '.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' <<< "$manifest"); do
            image_config="$(docker buildx imagetools inspect "$IMAGE_REGISTRY/$APP_IMAGE_NAME@$image_digest" --format '{{json .Image}}')"
            if ! jq -e --arg sha "$SOURCE_SHA" '.config.Labels["org.opencontainers.image.revision"] == $sha' <<< "$image_config" >/dev/null; then
              echo "App image revision does not match the requested source SHA." >&2
              exit 1
            fi
            if ! jq -e '.config.Labels["dev.benzhang.teslacam-replay.origin-policy"] == "2"' <<< "$image_config" >/dev/null; then
              echo "App image must support the hosted same-origin API and media policy." >&2
              exit 1
            fi
          done
          echo "image=$IMAGE_REGISTRY/$APP_IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"

  publish-gdrive:
    needs: [prepare, build-gdrive]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.rollback == 'true' || needs.build-gdrive.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - id: publish
        env:
          ROLLBACK_IMAGE: ${{ needs.prepare.outputs.gdrive_image }}
        run: |
          if [[ -n "$ROLLBACK_IMAGE" ]]; then
            tag="$ROLLBACK_IMAGE"
          else
            tag="$IMAGE_REGISTRY/$GDRIVE_IMAGE_NAME:sha-$GDRIVE_SOURCE_SHA"
            docker buildx imagetools create \
              --tag "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
          fi
          manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<< "$manifest")"
          platforms="$(jq -r '[.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | "\(.platform.os)/\(.platform.architecture)"] | unique | sort | join(",")' <<< "$manifest")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid gdrive manifest digest: $digest" >&2
            exit 1
          fi
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "Gdrive manifest has unexpected platforms: $platforms" >&2
            exit 1
          fi
          echo "image=$IMAGE_REGISTRY/$GDRIVE_IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [prepare, publish-app, publish-gdrive]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.publish-app.result == 'success' && needs.publish-gdrive.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Check private deployment identity
        env:
          TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
          TAILSCALE_CI_TAG: ${{ vars.TAILSCALE_CI_TAG }}
        run: |
          : "${TAILSCALE_CLIENT_ID:?Missing production TAILSCALE_CLIENT_ID}"
          : "${TAILSCALE_AUDIENCE:?Missing production TAILSCALE_AUDIENCE}"
          : "${TAILSCALE_CI_TAG:?Missing production TAILSCALE_CI_TAG}"
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_CI_TAG }}
          version: 1.102.4
          args: --accept-dns=false
      - name: Restrict Tailscale routing
        shell: bash
        run: |
          sudo tailscale set --accept-routes=false
          sudo tailscale debug prefs | jq -e '.RouteAll == false and .CorpDNS == false' >/dev/null
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.35.7
      - uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1.2
        with:
          kubelogin-version: v0.2.19
      - uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AZURE_AKS_CLUSTER_NAME }}
          admin: false
          use-kubelogin: true
      - env:
          APP_IMAGE: ${{ needs.publish-app.outputs.image }}
          GDRIVE_IMAGE: ${{ needs.publish-gdrive.outputs.image }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          TESLACAM_KEY_VAULT_NAME: ${{ vars.TESLACAM_KEY_VAULT_NAME }}
          TESLACAM_SECRET_IDENTITY_CLIENT_ID: ${{ vars.TESLACAM_SECRET_IDENTITY_CLIENT_ID }}
          TESLACAM_URL: ${{ vars.TESLACAM_URL }}
        run: ./deploy/deploy.sh
