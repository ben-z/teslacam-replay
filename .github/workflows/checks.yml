name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Build production container
        run: docker build --build-arg SOURCE_SHA=image-smoke -t teslacam-replay:smoke .
      - name: Boot packaged application
        timeout-minutes: 1
        run: docker run --rm -i --entrypoint node teslacam-replay:smoke --import tsx/esm --input-type=module < deploy/container-smoke.mjs
      - run: bash -n deploy/deploy.sh deploy/bootstrap/bootstrap.sh
      - run: python3 -m unittest discover -s deploy/bootstrap -p 'test_*.py'
